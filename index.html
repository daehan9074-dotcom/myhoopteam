<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2b45">
<meta name="format-detection" content="telephone=no">
<title>나의 농구팀</title>
<!-- 카톡 등으로 팀 링크를 보낼 때 미리보기 -->
<meta name="description" content="우리 팀 참석 체크 · 팀 편성 · 경기 기록. 앱이 없어도 로그인하면 바로 참석 체크할 수 있어요.">
<meta property="og:type" content="website">
<meta property="og:title" content="나의 농구팀 · 참석 체크">
<meta property="og:description" content="앱이 없어도 로그인하면 바로 우리 팀 참석 체크·경기 기록을 볼 수 있어요.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 첫 로딩 화면: 농구공이 튀면서 돈다 (웹페이지와 같은 모양, 첫 화면이 그려지면 app.js 가 닫는다) -->
<div id="splash">
  <div class="bb-wrap">
    <svg class="bb" viewBox="0 0 100 100" role="img" aria-label="불러오는 중">
      <circle cx="50" cy="50" r="45" fill="#f26a1b"/>
      <g fill="none" stroke="#1d2b45" stroke-width="4.5" stroke-linecap="round">
        <circle cx="50" cy="50" r="45"/>
        <path d="M50 5V95"/><path d="M5 50H95"/>
        <path d="M19 16C36 32 36 68 19 84"/>
        <path d="M81 16C64 32 64 68 81 84"/>
      </g>
    </svg>
  </div>
  <div class="bb-sh"></div>
  <div class="bb-tx">불러오는 중...</div>
</div>
<!-- 스크립트가 멈춰도 로딩 화면에 갇히지 않도록 하는 안전장치 -->
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.classList.add('gone')},9000)</script>
<div id="app"></div>
<!-- 서버와 주고받는 동안 (0.45초 넘게 걸릴 때만) 가운데에 도는 농구공 -->
<div id="busy" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#f26a1b"/><g fill="none" stroke="#1d2b45" stroke-width="5" stroke-linecap="round"><circle cx="50" cy="50" r="45"/><path d="M50 5V95"/><path d="M5 50H95"/><path d="M19 16C36 32 36 68 19 84"/><path d="M81 16C64 32 64 68 81 84"/></g></svg></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="icons.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="remote.js"></script>
<script src="stats.js"></script>
<script src="app.js"></script>
<script src="record.js"></script>
</body>
</html>
